# Deploys the Portfolio to GitHub Pages on every push to main.
# Needs Settings > Pages > Source set to "GitHub Actions" (not "Deploy from a branch").
# What gets published is decided by .github/publish-site.sh.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the published folder
        run: bash .github/publish-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 30 minutes. The branch deploy timed out at ~10 on this ~90 MB site.
          timeout: 1800000
