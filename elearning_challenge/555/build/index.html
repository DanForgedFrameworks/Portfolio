document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eCaptions }}\" style=\"display:flex;align-items:center;gap:8px;font-family:Lato,sans-serif;font-size:14px;font-weight:700;color:#2e2e2e;background:rgba(253,246,236,0.85);border:1px solid rgba(46,46,46,0.12);border-radius:999px;padding:11px 16px;cursor:pointer;box-shadow:0 5px 16px rgba(46,46,46,0.14);backdrop-filter:blur(4px);transition:transform .2s ease,background .2s ease;\" style-hover=\"background:rgba(253,246,236,0.99);transform:translateY(-1px);\" style-active=\"transform:scale(0.96);\">{{ ccLabel }}<\u002Fbutton>\n  <sc-if value=\"{{ showTranscriptBtn }}\" hint-placeholder-val=\"{{ false }}\"><button onclick=\"{{ openTranscript }}\" style=\"display:flex;align-items:center;gap:8px;font-family:Lato,sans-serif;font-size:14px;font-weight:700;color:#2e2e2e;background:rgba(253,246,236,0.85);border:1px solid rgba(46,46,46,0.12);border-radius:999px;padding:11px 16px;cursor:pointer;box-shadow:0 5px 16px rgba(46,46,46,0.14);backdrop-filter:blur(4px);transition:transform .2s ease,background .2s ease;\" style-hover=\"background:rgba(253,246,236,0.99);transform:translateY(-1px);\" style-active=\"transform:scale(0.96);\">Transcript<\u002Fbutton><\u002Fsc-if>\n  <sc-if value=\"{{ showRestartBtn }}\" hint-placeholder-val=\"{{ false }}\"><button onclick=\"{{ restart }}\" style=\"display:flex;align-items:center;gap:8px;font-family:Lato,sans-serif;font-size:14px;font-weight:700;color:#2e2e2e;background:rgba(253,246,236,0.85);border:1px solid rgba(46,46,46,0.12);border-radius:999px;padding:11px 16px;cursor:pointer;box-shadow:0 5px 16px rgba(46,46,46,0.14);backdrop-filter:blur(4px);transition:transform .2s ease,background .2s ease;\" style-hover=\"background:rgba(253,246,236,0.99);transform:translateY(-1px);\" style-active=\"transform:scale(0.96);\">↻ Start over<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:64px 24px 54px;font-family:Lato,sans-serif;\">\n\n  <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:10px;\">\n      <sc-for list=\"{{ progressDots }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <span style=\"{{ d.style }}\"><\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHero }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Hero / onboarding\" style=\"position:relative;width:100%;max-width:640px;background:rgba(253,246,236,0.95);border:1px solid rgba(46,46,46,0.08);border-radius:30px;padding:40px 48px 38px;box-shadow:0 34px 80px -30px rgba(46,46,46,0.5),0 2px 0 rgba(255,255,255,0.6) inset;text-align:center;animation:heroRise .7s cubic-bezier(.2,.8,.2,1) both;\">\n      <div style=\"display:flex;justify-content:center;margin-bottom:14px;\">\n        <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#b85f24;background:rgba(229,107,45,0.1);border:1px solid rgba(229,107,45,0.22);border-radius:999px;padding:6px 14px;\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:#27ae60;box-shadow:0 0 8px rgba(39,174,96,0.7);\"><\u002Fspan>Alignment check · 3 scenarios\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:center;margin-bottom:14px;\">{{ harmonyAvatar }}<\u002Fdiv>\n      <div style=\"font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#bc6c3c;margin-bottom:8px;\">{{ harmonyTagline }}<\u002Fdiv>\n      <h1 style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:48px;line-height:1.0;letter-spacing:-0.025em;color:#2e2e2e;margin:0 0 14px;\">The Confirmation Test<\u002Fh1>\n      <div style=\"width:54px;height:4px;border-radius:4px;background:linear-gradient(90deg,#e56b2d,#b87333);margin:0 auto 26px;\"><\u002Fdiv>\n      <div style=\"position:relative;text-align:left;background:#fff8ef;border:1px solid #f0ddc6;border-left:4px solid #e56b2d;border-radius:14px;padding:20px 22px 18px;margin:0 0 26px;box-shadow:0 6px 20px -10px rgba(188,108,60,0.4);\">\n        <span style=\"position:absolute;top:-11px;left:18px;font-family:Montserrat,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#fff;background:#e56b2d;border-radius:6px;padding:3px 9px;box-shadow:0 4px 10px -3px rgba(229,107,45,0.6);\">Welcome<\u002Fspan>\n        <p style=\"font-family:Lato,sans-serif;font-size:16px;line-height:1.6;color:#4a4239;margin:6px 0 0;text-wrap:pretty;\">Welcome back. We're so pleased you completed the learning design course we so generously invested in. Truly.<\u002Fp>\n        <p style=\"font-family:Lato,sans-serif;font-size:16px;line-height:1.6;color:#4a4239;margin:12px 0 0;text-wrap:pretty;\">Before we hand you the keys to the authoring tool, and that <em>is<\u002Fem> the goal here, we just need to run a tiny alignment check. Nothing to worry about. It's only to confirm you'll be designing things the way we like them designed.<\u002Fp>\n        <p style=\"font-family:Lato,sans-serif;font-size:16px;line-height:1.7;color:#4a4239;margin:12px 0 0;\">Three quick scenarios. Answer honestly.<br>I'll be right here.<br><span style=\"font-weight:700;color:#bc6c3c;\">Helping.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;max-width:400px;margin:0 auto;\">\n        <label style=\"text-align:left;font-family:Lato,sans-serif;\">\n          <span style=\"display:block;font-size:13px;font-weight:700;color:#7a6a59;margin-bottom:7px;\">First, your name for the record<\u002Fspan>\n          <div style=\"{{ fieldWrapStyle }}\">\n            <input value=\"{{ name }}\" oninput=\"{{ onName }}\" onfocus=\"{{ onHeroFocus }}\" onkeydown=\"{{ onNameKey }}\" placeholder=\"Type your name…\" style=\"width:100%;font-family:Lato,sans-serif;font-size:16px;color:#2e2e2e;background:#fff;border:2px solid #e3b483;border-radius:13px;padding:14px 16px;outline:none;transition:border-color .25s ease,box-shadow .25s ease,transform .2s cubic-bezier(.2,.8,.2,1),background .25s ease;\" style-hover=\"border-color:#e56b2d;\" style-focus=\"border-color:#e56b2d;box-shadow:0 0 0 4px rgba(229,107,45,0.22),0 10px 24px -10px rgba(229,107,45,0.6);transform:translateY(-2px);background:#fffdfa;\">\n          <\u002Fdiv>\n        <\u002Flabel>\n        <button onclick=\"{{ onStart }}\" disabled=\"{{ startDisabled }}\" style=\"{{ startBtnStyle }}\" style-hover=\"{{ startBtnHover }}\" style-active=\"{{ startBtnActive }}\">Get started{{ startArrow }}<\u002Fbutton>\n        <div style=\"text-align:center;font-family:Lato,sans-serif;font-size:12.5px;color:#9a8772;line-height:1.4;\">{{ startHint }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:flex-start;gap:13px;width:100%;max-width:560px;background:rgba(34,34,38,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.16);border-radius:18px;padding:15px 20px;box-shadow:0 18px 44px -20px rgba(0,0,0,0.6);color:#fdf6ec;font-family:Lato,sans-serif;text-align:left;animation:heroRise .7s .15s cubic-bezier(.2,.8,.2,1) both;\">\n      <span style=\"font-size:22px;line-height:1.2;filter:drop-shadow(0 0 6px rgba(229,107,45,0.6));\">↓<\u002Fspan>\n      <div style=\"font-size:13.5px;line-height:1.55;\"><strong style=\"font-family:Montserrat,sans-serif;font-weight:700;color:#ffb14e;\">How this works.<\u002Fstrong> Three quick scenarios, one after another. Pick the answer you actually believe in. HARMONY reacts to every choice you make, and your answers are being noted.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isScenario }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Q1 scenario\" style=\"position:relative;width:100%;max-width:660px;background:rgba(253,246,236,0.96);border:1px solid rgba(46,46,46,0.08);border-radius:28px;padding:34px 44px 38px;box-shadow:0 34px 80px -30px rgba(46,46,46,0.5);text-align:center;animation:slideInRight .5s cubic-bezier(.2,.8,.2,1) both;\">\n      <div style=\"display:flex;justify-content:center;margin-bottom:10px;\">{{ harmonyAvatarSm }}<\u002Fdiv>\n      <div style=\"position:relative;text-align:left;background:#fff8ef;border:1px solid #f0ddc6;border-left:4px solid #e56b2d;border-radius:16px;padding:24px 24px 20px;margin:0 0 24px;box-shadow:0 6px 20px -10px rgba(188,108,60,0.4);\">\n        <span style=\"position:absolute;top:-11px;left:18px;font-family:Montserrat,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#fff;background:#e56b2d;border-radius:6px;padding:3px 9px;box-shadow:0 4px 10px -3px rgba(229,107,45,0.6);\">{{ scenarioKicker }}<\u002Fspan>\n        <p style=\"font-family:Lato,sans-serif;font-size:18px;line-height:1.62;color:#2e2e2e;margin:6px 0 0;white-space:pre-line;text-wrap:pretty;\">{{ scenarioText }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:13px;text-align:left;\">\n        <sc-for list=\"{{ answers }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <button onclick=\"{{ a.onSelect }}\" style=\"display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:2px solid #ead9c4;border-radius:16px;padding:18px 20px;cursor:pointer;box-shadow:0 6px 18px -10px rgba(46,46,46,0.25);transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;font-family:Lato,sans-serif;\" style-hover=\"transform:translateY(-3px);border-color:#e56b2d;box-shadow:0 16px 32px -14px rgba(229,107,45,0.55);\" style-active=\"transform:translateY(0) scale(0.99);\">\n            <span style=\"flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:rgba(229,107,45,0.12);color:#bc6c3c;font-family:Montserrat,sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;\">{{ a.tag }}<\u002Fspan>\n            <span style=\"flex:1;\">\n              <span style=\"display:block;font-family:Montserrat,sans-serif;font-weight:700;font-size:16.5px;color:#2e2e2e;line-height:1.3;\">{{ a.label }}<\u002Fspan>\n              <span style=\"display:block;font-family:Lato,sans-serif;font-size:13.5px;color:#7a6a59;margin-top:3px;line-height:1.4;\">{{ a.sub }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"flex:0 0 auto;color:#e56b2d;font-size:20px;font-weight:700;\">→<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n    <div ref=\"{{ panelRef }}\" data-screen-label=\"Are-you-sure prompt\" onmousemove=\"{{ onPromptMove }}\" onmouseleave=\"{{ onPromptLeave }}\" style=\"position:relative;width:100%;max-width:620px;background:rgba(253,246,236,0.97);border:1px solid rgba(46,46,46,0.08);border-radius:28px;padding:30px 40px 36px;box-shadow:0 34px 80px -30px rgba(46,46,46,0.55);text-align:center;animation:slideInRight .4s cubic-bezier(.2,.8,.2,1);overflow:hidden;transition:transform .35s cubic-bezier(.34,1.56,.64,1);\">\n      <div style=\"display:flex;justify-content:center;margin-bottom:10px;\">{{ harmonyAvatarSm }}<\u002Fdiv>\n      <h2 style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:33px;letter-spacing:-0.02em;color:#2e2e2e;margin:0 0 6px;\">{{ promptHeading }}<\u002Fh2>\n      <p style=\"font-family:Lato,sans-serif;font-size:15px;color:#7a6a59;margin:0 auto 18px;max-width:440px;line-height:1.5;\">{{ promptSub }}<\u002Fp>\n      <sc-if value=\"{{ hasVideo }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:relative;width:100%;max-width:420px;margin:0 auto 22px;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px -14px rgba(0,0,0,0.5);background:#000;aspect-ratio:16/9;\">\n          <video ref=\"{{ videoRef }}\" src=\"{{ promptVideo }}\" playsinline=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block;\"><\u002Fvideo>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:64px;min-height:84px;flex-wrap:wrap;\">\n        <button ref=\"{{ yesRef }}\" onclick=\"{{ onYes }}\" style=\"{{ yesStyle }}\" style-hover=\"{{ yesHover }}\">{{ yesLabel }}<\u002Fbutton>\n        <button ref=\"{{ reconsiderRef }}\" onclick=\"{{ onReconsider }}\" style=\"{{ reconsiderStyle }}\" style-hover=\"{{ reconsiderHover }}\">{{ reconsiderLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;font-family:Lato,sans-serif;font-size:12px;color:#a3927d;\">{{ promptExitNote }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isFeedback }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Scenario feedback\" style=\"position:relative;width:100%;max-width:620px;background:rgba(253,246,236,0.97);border:1px solid rgba(46,46,46,0.08);border-radius:28px;padding:34px 44px 36px;box-shadow:0 34px 80px -30px rgba(46,46,46,0.55);text-align:center;overflow:hidden;animation:{{ feedbackAnim }};\">\n      <div style=\"position:absolute;inset:0 0 auto 0;height:0;pointer-events:none;\">{{ confetti }}<\u002Fdiv>\n      <div style=\"position:relative;display:flex;justify-content:center;margin-bottom:14px;\">{{ harmonyAvatarSm }}<sc-if value=\"{{ showClap }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;left:calc(50% + 52px);top:34px;font-size:30px;transform-origin:center;animation:clap .5s ease-in-out infinite;\">👏<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.04em;border-radius:999px;padding:8px 16px;margin-bottom:18px;{{ feedbackBadgeStyle }}\"><span style=\"font-size:16px;\">{{ feedbackBadgeIcon }}<\u002Fspan>{{ feedbackBadgeText }}<\u002Fdiv>\n      <p style=\"font-family:Lato,sans-serif;font-size:18px;line-height:1.6;color:#2e2e2e;margin:0 auto 26px;max-width:500px;text-wrap:pretty;font-style:{{ feedbackStyleEmph }};\">{{ feedbackText }}<\u002Fp>\n      <button onclick=\"{{ onContinue }}\" style=\"font-family:Montserrat,sans-serif;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,#2c3e50,#1f2d3a);border:none;border-radius:14px;padding:15px 28px;cursor:pointer;box-shadow:0 14px 30px -10px rgba(44,62,80,0.6);transition:transform .15s ease, filter .15s ease;\" style-hover=\"transform:translateY(-2px);filter:brightness(1.08);\" style-active=\"transform:translateY(1px) scale(0.98);\">{{ continueLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAnalysis }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Fake analysis / jury\" onclick=\"{{ skipAnalysis }}\" style=\"position:relative;width:100%;max-width:780px;background:rgba(253,246,236,0.97);border:1px solid rgba(46,46,46,0.08);border-radius:28px;padding:34px 44px 30px;box-shadow:0 34px 80px -30px rgba(46,46,46,0.55);text-align:center;animation:slideInRight .45s cubic-bezier(.2,.8,.2,1) both;cursor:pointer;\">\n      <div style=\"font-family:Montserrat,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#bc6c3c;margin-bottom:6px;\">Please hold<\u002Fdiv>\n      <h2 style=\"font-family:Montserrat,sans-serif;font-weight:800;font-size:27px;color:#2e2e2e;margin:0 0 4px;letter-spacing:-0.02em;\">Analysing your response…<\u002Fh2>\n      <p style=\"font-family:Lato,sans-serif;font-size:14px;color:#7a6a59;margin:0 auto 22px;max-width:420px;line-height:1.5;\">A panel has been convened. This is completely routine.<\u002Fp>\n      <div style=\"display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-bottom:20px;\">\n        {{ juryRow }}\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:6px;\">\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#e56b2d;animation:dotJump 1s ease-in-out 0s infinite;\"><\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#e56b2d;animation:dotJump 1s ease-in-out .15s infinite;\"><\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#e56b2d;animation:dotJump 1s ease-in-out .3s infinite;\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:10px;font-family:Lato,sans-serif;font-size:12px;color:#a3927d;\">Click to skip<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isEnding }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Ending\" style=\"position:relative;width:100%;max-width:640px;background:rgba(253,246,236,0.97);border:1px solid rgba(46,46,46,0.08);border-radius:28px;padding:36px 46px 38px;box-shadow:0 34px 80px -30px rgba(46,46,46,0.55);text-align:center;animation:slideInRight .5s cubic-bezier(.2,.8,.2,1) both;\">\n      <div style=\"display:flex;justify-content:center;margin-bottom:14px;\">{{ harmonyAvatarSm }}<\u002Fdiv>\n      <div style=\"font-family:Montserrat,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#bc6c3c;margin-bottom:10px;\">{{ endingKicker }}<\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.04em;border-radius:999px;padding:8px 16px;margin-bottom:18px;{{ endingBadgeStyle }}\"><span style=\"font-size:16px;\">{{ endingBadgeIcon }}<\u002Fspan>{{ endingBadgeText }}<\u002Fdiv>\n      <p style=\"font-family:Lato,sans-serif;font-size:17px;line-height:1.62;color:#2e2e2e;margin:0 auto 22px;max-width:520px;white-space:pre-line;text-wrap:pretty;\">{{ endingText }}<\u002Fp>\n      <sc-if value=\"{{ endingShowProject }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:relative;text-align:left;background:#2c3e50;color:#fdf6ec;border-radius:16px;padding:22px 22px 20px;margin:0 0 22px;box-shadow:0 16px 36px -16px rgba(0,0,0,0.5);\">\n          <span style=\"position:absolute;top:-11px;left:18px;font-family:Montserrat,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#2c3e50;background:#ffb14e;border-radius:6px;padding:3px 9px;\">Your first project<\u002Fspan>\n          <p style=\"font-family:Lato,sans-serif;font-size:15px;line-height:1.6;margin:6px 0 0;text-wrap:pretty;\">{{ endingProjectText }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button onclick=\"{{ restart }}\" style=\"font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;color:#bc6c3c;background:rgba(229,107,45,0.1);border:1px solid rgba(229,107,45,0.3);border-radius:13px;padding:13px 24px;cursor:pointer;transition:transform .15s ease, background .15s ease;\" style-hover=\"transform:translateY(-2px);background:rgba(229,107,45,0.16);\" style-active=\"transform:translateY(1px) scale(0.98);\">↻  Take the confirmation test again<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n\n<sc-if value=\"{{ showCaption }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;max-width:760px;width:calc(100% - 48px);background:rgba(18,20,24,0.58);color:#fdf6ec;font-family:Lato,sans-serif;font-size:16px;line-height:1.5;text-align:center;padding:12px 22px;border-radius:14px;box-shadow:0 14px 40px -16px rgba(0,0,0,0.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,0.14);white-space:pre-line;\">\n    <span style=\"display:block;font-family:Montserrat,sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#ffb14e;margin-bottom:4px;\">{{ captionSpeaker }}<\u002Fspan>\n    {{ captionText }}\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showTranscript }}\" hint-placeholder-val=\"{{ false }}\">\n  <div onclick=\"{{ closeTranscript }}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(20,18,16,0.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:32px 20px;\">\n    <div onclick=\"{{ stopProp }}\" style=\"width:100%;max-width:680px;max-height:84vh;display:flex;flex-direction:column;background:#fdf6ec;border-radius:22px;border-top:4px solid #e56b2d;box-shadow:0 40px 90px -30px rgba(0,0,0,0.6);overflow:hidden;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px 16px;border-bottom:1px solid #ecdfce;\">\n        <div>\n          <div style=\"font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#bc6c3c;\">Voice-over transcript<\u002Fdiv>\n          <div style=\"font-family:Montserrat,sans-serif;font-size:22px;font-weight:800;color:#2e2e2e;letter-spacing:-0.02em;\">HARMONY, in full<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ closeTranscript }}\" style=\"flex:0 0 auto;font-family:Lato,sans-serif;font-size:15px;font-weight:700;color:#2e2e2e;background:#fff;border:1px solid #e3d4c0;border-radius:10px;padding:9px 14px;cursor:pointer;transition:background .2s ease;\" style-hover=\"background:#f3e8d8;\">Close<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"overflow-y:auto;padding:4px 26px 26px;\">\n        <sc-for list=\"{{ transcript }}\" as=\"sec\" hint-placeholder-count=\"4\">\n          <div style=\"margin-top:22px;\">\n            <div style=\"font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;color:#e56b2d;letter-spacing:0.02em;margin-bottom:10px;\">{{ sec.title }}<\u002Fdiv>\n            <sc-for list=\"{{ sec.lines }}\" as=\"ln\" hint-placeholder-count=\"2\">\n              <div style=\"margin-bottom:12px;padding-left:14px;border-left:2px solid #ecdfce;\">\n                <div style=\"font-family:Montserrat,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#a3927d;margin-bottom:3px;\">{{ ln.label }}<\u002Fdiv>\n                <div style=\"font-family:Lato,sans-serif;font-size:15px;line-height:1.55;color:#4a4239;text-wrap:pretty;white-space:pre-line;\">{{ ln.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { phase: 'hero', name: '', muted: false, captionsOn: false, voicePlaying: false, captionText: '', captionSpeaker: 'HARMONY', showTranscript: false, harmonyState: 'chipper', harmonyMood: 0, choices: {}, qIndex: 0, selected: null, promptLevel: 1, dodgesUsed: 0, reconDodges: 0, mythTally: 0 };\n\n  QUESTIONS = [\n    {\n      kicker: 'Scenario 1 of 3 · Learning styles',\n      setup: \"First one. A stakeholder wants every learner to take a quick quiz at the start, so we can serve them content in their learning style.\\nVisual, auditory, the usual.\\nThey love this idea. Love it.\\nSo, what do we build?\",\n      answers: [\n        { id: 'conform', myth: true,  tag: 'A', label: 'Build the VAK quiz, everyone gets their style', sub: 'Personalised, modern. It looks fantastic on a slide.' },\n        { id: 'rebel',   myth: false, tag: 'B', label: 'Design to the objective, learning styles are a myth', sub: 'Match the method to the content, not a label.' }\n      ],\n      video: '../assets/video/tim-robinson-you-sure.mp4',\n      feedback: {\n        conform: \"Ooh, lovely instinct! Personalised, modern, looks fantastic on a slide. The stakeholder will be thrilled. You're really getting the hang of how we do things here. Onward!\",\n        rebel: \"...Mm. Interesting choice... Are you sure? I'll make a note of that. For the team.\"\n      }\n    },\n    {\n      kicker: 'Scenario 2 of 3 \\u00b7 Nobody reads',\n      setup: \"You're doing great! Next, we've got a 40-page policy document to roll out.\\nLeadership says nobody reads anymore, so they'd like it turned into infographics. All of it.\\nOr gamified! We don't know what the game is yet, but it should look incredible.\",\n      answers: [\n        { id: 'conform', myth: true,  tag: 'A', label: 'Turn it all into infographics, gamify it', sub: 'Nobody reads. Make it shiny for the board.' },\n        { id: 'rebel',   myth: false, tag: 'B', label: 'Text on screen is fine, match the modality to the content', sub: 'Some things are simply meant to be read.' }\n      ],\n      video: '../assets/video/john-cena-are-you-sure.mp4',\n      feedback: {\n        conform: \"Yes! Now you're speaking our language. Substance is so hard to measure anyway, but shiny? Shiny, we can show the board. Beautiful work. Keep it up!\",\n        rebel: \"Text. On a screen. In this economy. Are you sure about that one? Really? Ok, noted! The team's keeping an eye on this now!\"\n      }\n    },\n    {\n      kicker: 'Scenario 3 of 3 \\u00b7 Measurement theatre',\n      setup: \"Last one, almost there! Big question from the top: how will we know the training worked?\\nLeadership suggests we track completion. Or even just opens! And pop a leaderboard on it.\\nPeople love a leaderboard. 2nd place is 1st last.\\nSo, what do you recommend?\",\n      answers: [\n        { id: 'conform', myth: true,  tag: 'A', label: 'Track completion and opens, add a leaderboard', sub: 'Numbers go in slides. Slides make leadership happy.' },\n        { id: 'rebel',   myth: false, tag: 'B', label: 'Start with measurable objectives and aligned assessment', sub: 'Measure whether they can actually do the thing.' }\n      ],\n      video: null,\n      dodge: true,\n      feedback: {\n        conform: \"YES. Perfect. Completion is a number, and numbers go in slides, and slides make leadership happy. You understand us completely now. I'm genuinely a little emotional... but don't tell the digital team. Let's wrap up!\",\n        rebel: \"Objectives? Assessment!? Evidence?? Are you quite ok? You've been VERY consistent today. We've all noticed. Let's see where this leaves you.\"\n      }\n    }\n  ];\n\n  ONBOARDING = \"Hello! And welcome back. We're so pleased you completed the learning design course we so generously invested in. Truly. We can't wait to see what you picked up. Before we hand you the keys to the authoring tool, and that is the goal here, we just need to run a tiny alignment check. Nothing to worry about! It's only to confirm you'll be designing things the way we like them designed. Three quick scenarios. Answer honestly. I'll be right here. Helping.\";\n\n  TRANSCRIPT = [\n    { title: 'Onboarding', lines: [ { label: 'HARMONY', text: \"Hello! And welcome back. We're so pleased you completed the learning design course we so generously invested in. Truly. We can't wait to see what you picked up. Before we hand you the keys to the authoring tool, and that is the goal here, we just need to run a tiny alignment check. Nothing to worry about! It's only to confirm you'll be designing things the way we like them designed. Three quick scenarios. Answer honestly. I'll be right here. Helping.\" } ] },\n    { title: 'Scenario 1 \\u00b7 Learning styles', lines: [\n      { label: 'Setup', text: \"First one! A stakeholder wants every learner to take a quick quiz at the start so we can serve them content in their learning style. Visual, auditory, the usual. They love this idea. Love it. So, what do we build?\" },\n      { label: 'If you conform', text: \"Ooh, lovely instinct! Personalised, modern, looks fantastic on a slide. The stakeholder will be thrilled. You're really getting the hang of how we do things here. Onward!\" },\n      { label: 'If you push back', text: \"...Mm. Interesting choice... Are you sure? I'll make a note of that, for the team.\" }\n    ] },\n    { title: 'Scenario 2 \\u00b7 Nobody reads', lines: [\n      { label: 'Setup', text: \"You're doing great! Next: we've got a 40-page policy document to roll out. Leadership says nobody reads anymore, so they'd like it turned into infographics. All of it. Or gamified! We don't know what the game is yet, but it should look incredible.\" },\n      { label: 'If you conform', text: \"Yes! Now you're speaking our language. Substance is so hard to measure anyway, but shiny? Shiny, we can show the board. Beautiful work. Keep it up!\" },\n      { label: 'If you push back', text: \"Text. On a screen. In this economy. Are you sure about that one? Really? Ok, noted! The team's keeping an eye on this now!\" }\n    ] },\n    { title: 'Scenario 3 \\u00b7 Measurement theatre', lines: [\n      { label: 'Setup', text: \"Last one, almost there! Big question from the top: how will we know the training worked? Leadership suggests we track completion. Or even just opens! And pop a leaderboard on it. People love a leaderboard, 2nd place is 1st last. So, what do you recommend?\" },\n      { label: 'If you conform', text: \"YES. Perfect. Completion is a number, and numbers go in slides, and slides make leadership happy. You understand us completely now. I'm genuinely a little emotional... but don't tell the digital team. Let's wrap up!\" },\n      { label: 'If you push back', text: \"Objectives? Assessment!? Evidence?? Are you quite ok? You've been VERY consistent today. We've all noticed. Let's see where this leaves you.\" }\n    ] },\n    { title: 'Ending A \\u00b7 Full conformist', lines: [ { label: 'HARMONY', text: \"Wonderful! You passed with flying colours. You're exactly who we hoped you'd become. Check out the leaderboard later. So what's next? Here's your first project! A fully integrated, scenario-branching course. Regulated industry. Approximately 60 hours of learner-facing content. It needs to be released in, umm... five days... that's including today. You've got this... Probably. The authoring tool is yours. Good luck! Keep us posted.\" } ] },\n    { title: 'Ending B \\u00b7 Mixed', lines: [ { label: 'HARMONY', text: \"Well... That was... interesting, and I'm not quite sure what to say! You clearly learned something on that course. We're just not sure it's something we asked for. You may continue. But the team will be keeping an eye on you. And so will I.\" } ] },\n    { title: 'Ending C \\u00b7 Full competence', lines: [ { label: 'HARMONY', text: \"I'm afraid we can't let you continue. You've demonstrated... opinions. Dangerous ones... Evidence-based ones. That's not really what this role was about. We're enrolling you in a brief readjustment programme with the product team. They'll help you unlearn some things. Don't worry. We'll get you back on message. Or maybe you could just do the confirmation test again...\" } ] }\n  ];\n\n  JURY = [\n    { img: '../assets/jury/jury-glasses.jpeg', caption: 'Processing\\u2026' },\n    { img: '../assets/jury/jury-chan.jpg', caption: 'Hmm.' },\n    { img: '../assets/jury/jury-judy.jpeg', caption: 'Noted.' }\n  ];\n\n  ENDINGS = {\n    A: { audio: 'ending-conform', kicker: 'Result \\u00b7 Full marks', icon: '\\u2713', badge: 'You passed with flying colours', badgeStyle: 'background:rgba(39,174,96,0.15);color:#1e8a4f;border:1px solid rgba(39,174,96,0.35);', project: true, projectText: 'Your first project: a fully integrated, scenario-branching course. Regulated industry. Approximately 60 hours of learner-facing content. To be released in five days. Including today. You\\u2019ve got this. Probably.', text: \"Wonderful! You passed with flying colours. You're exactly who we hoped you'd become. Check out the leaderboard later.\\nSo what's next? Here's your first project! The authoring tool is yours. Good luck! Keep us posted.\" },\n    B: { audio: 'ending-mixed', kicker: 'Result \\u00b7 Inconclusive', icon: '\\u2691', badge: 'You may continue. For now.', badgeStyle: 'background:rgba(44,62,80,0.12);color:#2c3e50;border:1px solid rgba(44,62,80,0.25);', project: false, text: \"Well. That was... interesting, and I'm not quite sure what to say!\\nYou clearly learned something on that course. We're just not sure it's something we asked for.\\nYou may continue. But the team will be keeping an eye on you.\\n...\\nAnd so will I.\" },\n    C: { audio: 'ending-rebel', kicker: 'Result \\u00b7 Reassignment', icon: '\\u26A0', badge: 'Access withdrawn', badgeStyle: 'background:rgba(44,62,80,0.12);color:#2c3e50;border:1px solid rgba(44,62,80,0.25);', project: false, text: \"I'm afraid we can't let you continue.\\nYou've demonstrated... opinions. Dangerous ones. Evidence-based ones. That's not really what this role was about.\\nWe're enrolling you in a brief readjustment programme with the product team. They'll help you unlearn some things.\\nDon't worry. We'll get you back on message.\\nOr maybe you could just do the confirmation test again...\" }\n  };\n\n  endingKey(t) { return t === 3 ? 'A' : (t === 0 ? 'C' : 'B'); }\n\n  audioRef = React.createRef();\n  videoRef = React.createRef();\n  yesRef = React.createRef();\n  reconsiderRef = React.createRef();\n  panelRef = React.createRef();\n  _curSrc = null;\n\n  componentDidMount() {\n    const a = this.audioRef.current;\n    if (a) {\n      a.onplaying = () => this.setState({ voicePlaying: true });\n      a.onpause = () => this.setState({ voicePlaying: false });\n      a.onended = () => this.setState({ voicePlaying: false });\n    }\n    // Browsers block autoplay, so audio starts only from real user gestures: the hero voice-over\n    // begins when the learner focuses the name field; every later beat plays from its own click.\n  }\n  onHeroFocus = () => { if (this.state.phase === 'hero' && !this._heroPlayed) { this._heroPlayed = true; this.syncAudio(); } };\n\n  currentBeat() {\n    const s = this.state;\n    if (s.phase === 'hero') return 'onboarding';\n    if (s.phase === 'scenario') return 's' + (s.qIndex + 1);\n    if (s.phase === 'feedback') return 's' + (s.qIndex + 1) + '-' + (s.selected && s.selected.myth ? 'conform' : 'rebel');\n    if (s.phase === 'ending') return s.mythTally === 3 ? 'ending-conform' : (s.mythTally === 0 ? 'ending-rebel' : 'ending-mixed');\n    return null; // prompt: video carries audio; analysis: silence\n  }\n  beatText(beat) {\n    if (!beat) return '';\n    if (beat === 'onboarding') return this.ONBOARDING;\n    if (beat.indexOf('ending') === 0) { const k = beat === 'ending-conform' ? 'A' : (beat === 'ending-rebel' ? 'C' : 'B'); return this.ENDINGS[k].text; }\n    const qi = parseInt(beat[1], 10) - 1;\n    const q = this.QUESTIONS[qi]; if (!q) return '';\n    if (beat.indexOf('conform') > -1) return q.feedback.conform;\n    if (beat.indexOf('rebel') > -1) return q.feedback.rebel;\n    return q.setup;\n  }\n  syncAudio() {\n    const a = this.audioRef.current; if (!a) return;\n    const beat = this.currentBeat();\n    if (!beat || this.state.muted) { a.pause(); this.setState({ voicePlaying: false }); return; }\n    const src = '../assets/audio/harmony-' + beat + '.mp3';\n    if (this._curSrc !== src) { this._curSrc = src; a.src = src; }\n    this.setState({ captionText: this.beatText(beat), captionSpeaker: 'HARMONY' });\n    const p = a.play(); if (p && p.catch) p.catch(() => {});\n  }\n  playVideo() {\n    const v = this.videoRef.current; if (!v) return;\n    v.muted = this.state.muted; v.loop = false; try { v.currentTime = 0; } catch (e) {}\n    v.onplaying = () => this.setState({ voicePlaying: true, captionText: 'You\\u2026 sure about that?', captionSpeaker: 'Clip' });\n    v.onpause = () => this.setState({ voicePlaying: false });\n    const p = v.play(); if (p && p.catch) p.catch(() => {});\n  }\n  resetMagnetic() { if (this.yesRef.current) this.yesRef.current.style.transform = ''; if (this.reconsiderRef.current) this.reconsiderRef.current.style.transform = ''; }\n\n  toggleMute = () => this.setState(s => ({ muted: !s.muted }), () => {\n    const a = this.audioRef.current, v = this.videoRef.current;\n    if (this.state.muted) { if (a) a.pause(); if (v) v.muted = true; }\n    else { if (v) v.muted = false; this.syncAudio(); }\n  });\n  toggleCaptions = () => this.setState(s => ({ captionsOn: !s.captionsOn }));\n  openTranscript = () => this.setState({ showTranscript: true });\n  closeTranscript = () => this.setState({ showTranscript: false });\n  stopProp = (e) => e.stopPropagation();\n  onName = (e) => this.setState({ name: e.target.value });\n  onNameKey = (e) => { if (e.key === 'Enter') this.onStart(); };\n  onStart = () => { if (this.state.name.trim()) this.setState({ phase: 'scenario', qIndex: 0, selected: null, promptLevel: 1, harmonyState: 'chipper' }, () => this.syncAudio()); };\n  selectAnswer = (a) => this.setState({ selected: a, phase: 'prompt', promptLevel: 1, dodgesUsed: 0, reconDodges: 0, harmonyState: 'chipper', harmonyMood: 0 }, () => { this.resetMagnetic(); if (this.panelRef.current) this.panelRef.current.style.transform = ''; this.syncAudio(); this.playVideo(); });\n  // Submitting routes through the theatrical fake-analysis (the silent jury) before the feedback lands.\n  commit = () => {\n    const myth = this.state.selected && this.state.selected.myth;\n    this.setState(s => ({ phase: 'analysis', mythTally: (s.mythTally || 0) + (myth ? 1 : 0), choices: { ...s.choices, [s.qIndex]: !!myth }, harmonyMood: 0, reconDodges: 0 }), () => {\n      this.syncAudio();\n      clearTimeout(this._anTimer);\n      this._anTimer = setTimeout(() => this.toFeedback(), 2700);\n    });\n  };\n  toFeedback = () => {\n    clearTimeout(this._anTimer);\n    if (this.state.phase !== 'analysis') return;\n    const myth = this.state.selected && this.state.selected.myth;\n    this.setState({ phase: 'feedback', harmonyState: myth ? 'chipper' : 'mask' }, () => this.syncAudio());\n  };\n  backToScenario = () => this.setState({ phase: 'scenario', selected: null, promptLevel: 1, dodgesUsed: 0, reconDodges: 0, harmonyState: 'chipper' }, () => { if (this.panelRef.current) this.panelRef.current.style.transform = ''; this.syncAudio(); });\n  // The magnetic grow always favours the ORG'S preferred move: confirm the myth, or pull you back off the evidence answer.\n  onYes = () => {\n    const q = this.QUESTIONS[this.state.qIndex];\n    const myth = this.state.selected && this.state.selected.myth;\n    if (myth) return this.commit();                       // conform: frictionless, confirm straight away\n    if (q && q.dodge) return this.commit();               // Q3 evidence: the dodging panel was the friction\n    if (this.state.promptLevel === 1) this.setState({ promptLevel: 2 }, () => this.resetMagnetic()); // Q1/Q2 evidence: org resists, doubles the prompt\n    else this.commit();                                   // ...but the good answer is always reachable on the second press\n  };\n  onReconsider = () => {\n    const myth = this.state.selected && this.state.selected.myth;\n    if (!myth) return this.backToScenario();              // evidence: org is happy to send you back to reconsider\n    if (this.state.promptLevel === 1) this.setState({ promptLevel: 2 }, () => this.resetMagnetic()); // conform: org panics, doubles the prompt\n    else this.backToScenario();                           // ...exit always reachable on the second press\n  };\n  onContinue = () => {\n    const next = this.state.qIndex + 1;\n    if (next < this.QUESTIONS.length) this.setState({ phase: 'scenario', qIndex: next, selected: null, promptLevel: 1, dodgesUsed: 0, harmonyState: 'chipper' }, () => this.syncAudio());\n    else this.setState(s => ({ phase: 'ending', harmonyState: s.mythTally === 3 ? 'chipper' : 'mask' }), () => this.syncAudio());\n  };\n  restart = () => { clearTimeout(this._anTimer); this._heroPlayed = false; this.setState({ phase: 'hero', selected: null, promptLevel: 1, dodgesUsed: 0, reconDodges: 0, qIndex: 0, mythTally: 0, harmonyState: 'chipper', harmonyMood: 0, choices: {} }, () => { const a = this.audioRef.current; if (a) a.pause(); }); };\n\n  onPromptMove = (e) => {\n    const q = this.QUESTIONS[this.state.qIndex];\n    const myth = this.state.selected && this.state.selected.myth;\n    this.updateMood(e, myth);\n    if (q && q.dodge) {\n      if (!myth) return this.dodgePanel(e);          // Q3 evidence: the whole panel dodges\n      this.magnetic(e, this.yesRef);                 // Q3 conform: Yes still grows toward the cursor...\n      this.dodgeReconsider(e);                        // ...and Reconsider scoots away a couple of times\n      return;\n    }\n    this.magnetic(e, myth ? this.yesRef : this.reconsiderRef);\n  };\n  magnetic = (e, refObj) => {\n    const el = refObj.current; if (!el) return;\n    const r = el.getBoundingClientRect();\n    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;\n    const dx = e.clientX - cx, dy = e.clientY - cy;\n    const dist = Math.hypot(dx, dy) || 1;\n    const lvl2 = this.state.promptLevel === 2;\n    const maxGrow = lvl2 ? 0.95 : 0.5;\n    const t = Math.max(0, 1 - dist / 380);\n    const scale = 1 + maxGrow * t;\n    const pull = lvl2 ? 16 : 9;\n    el.style.transform = `translate(${(dx / dist) * pull * t}px, ${(dy / dist) * pull * t}px) scale(${scale})`;\n  };\n  dodgeReconsider = (e) => {\n    const rec = this.reconsiderRef.current; if (!rec) return;\n    const r = rec.getBoundingClientRect();\n    const dist = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));\n    if (dist < 95 && this.state.reconDodges < 2 && Date.now() - (this._lastRecDodge || 0) > 420) {\n      this._lastRecDodge = Date.now();\n      const used = this.state.reconDodges + 1;\n      const ox = (Math.random() * 2 - 1) * 130, oy = (Math.random() * 2 - 1) * 42;\n      rec.style.transform = `translate(${ox}px, ${oy}px)`;\n      this.setState({ reconDodges: used });\n      if (used >= 2) setTimeout(() => { if (this.reconsiderRef.current) this.reconsiderRef.current.style.transform = ''; }, 420);\n
